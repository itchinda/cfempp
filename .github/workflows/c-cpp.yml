name: PETSc Project CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Project Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran cmake python3 m4

    # Cache PETSc build to save time on subsequent runs
    - name: Cache PETSc
      id: cache-petsc
      uses: actions/cache@v3
      with:
        path: ~/petsc
        key: ${{ runner.os }}-petsc-3.24-opt-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Clone and Build PETSc
      if: steps.cache-petsc.outputs.cache-hit != 'true'
      run: |
        git clone -b release https://gitlab.com/petsc/petsc.git ~/petsc
        cd ~/petsc
        ./configure --with-debugging=no \
                    --download-fblaslapack \
                    --download-mpich \
                    --download-mumps \
                    --download-scalapack \
                    --PETSC_ARCH=arch-linux-c-opt  
        make PETSC_DIR=$HOME/petsc PETSC_ARCH=arch-linux-c-opt all

    - name: Configure and Build Project
      env:
        PETSC_DIR: ${{ github.workspace }}/../petsc
        PETSC_ARCH: arch-linux-c-opt
      run: |
        # Adjust PETSC_DIR to point to the cached home directory
        export PETSC_DIR=$HOME/petsc
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Run Tests
      env:
        PETSC_DIR: ${{ github.workspace }}/../petsc
        PETSC_ARCH: arch-linux-c-opt
      run: |
        export PETSC_DIR=$HOME/petsc
        export PATH=$PETSC_DIR/$PETSC_ARCH/bin:$PATH
        cd build
        # Run your app with mpiexec from the PETSc build
        mpiexec -n 2 ./odepp_app -ksp_monitor -ksp_error_if_not_converged
