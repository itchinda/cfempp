name: CFEM++ Project CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Continues other jobs even if one build type fails
      matrix:
        # Dual matrix: Build Type x MPI Ranks
        build_type: [Release, Debug]
        mpi_ranks: [2, 4]

    steps:
    - name: Checkout Project Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran cmake python3 m4 wget \
                                libgmp-dev libmpfr-dev libmpc-dev libzstd-dev \
                                libedit-dev libcurl4-openssl-dev zlib1g-dev

    # 3- Set Environment Variables based on Matrix
    - name: Set Configuration Variables
      run: |
        if [[ "${{ matrix.build_type }}" == "Debug" ]]; then
          echo "P_ARCH=arch-linux-c-debug" >> $GITHUB_ENV
          echo "P_DEBUG=yes" >> $GITHUB_ENV
        else
          echo "P_ARCH=arch-linux-c-opt" >> $GITHUB_ENV
          echo "P_DEBUG=no" >> $GITHUB_ENV
        fi
        echo "PETSC_DIR=$HOME/petsc" >> $GITHUB_ENV

    # 4- Cache PETSc (Key includes the architecture/build_type)
    - name: Cache PETSc
      id: cache-petsc
      uses: actions/cache@v4
      with:
        path: ~/petsc
        key: ${{ runner.os }}-petsc-3.24-${{ env.P_ARCH }}-v1

    - name: Build PETSc
      if: steps.cache-petsc.outputs.cache-hit != 'true'
      run: |
        git clone -b release https://gitlab.com/petsc/petsc.git $HOME/petsc
        cd $HOME/petsc
        ./configure --with-debugging=${{ env.P_DEBUG }} \
                    --download-fblaslapack \
                    --download-mpich \
                    --with-shared-libraries=1 \
                    --PETSC_ARCH=${{ env.P_ARCH }}
        make PETSC_DIR=$HOME/petsc PETSC_ARCH=${{ env.P_ARCH }} all

    # 5- Cache SymEngine (Separated by Build Type)
    - name: Cache SymEngine
      id: cache-symengine
      uses: actions/cache@v4
      with:
        path: ~/symengine_install
        key: ${{ runner.os }}-symengine-v14-${{ matrix.build_type }}-v1

    - name: Build SymEngine
      if: steps.cache-symengine.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/symengine/symengine ~/symengine
        cd ~/symengine
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX=$HOME/symengine_install \
          -DWITH_SYMENGINE_RCP=ON \
          -DWITH_LLVM=ON \
          -Dln_depend_mode=OFF
        make -j$(nproc) install

    # 6- Build CFEM++
    - name: Configure and Build Project
      run: |
        export PATH=$PETSC_DIR/$P_ARCH/bin:$PATH
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                 -DPETSC_DIR=$PETSC_DIR \
                 -DPETSC_ARCH=$P_ARCH \
                 -DSymEngine_DIR=$HOME/symengine_install/lib/cmake/symengine
        make -j$(nproc)

    # 7- Run Tests
    - name: Run Unit Tests
      run: |
        export PATH=$PETSC_DIR/$P_ARCH/bin:$PATH
        cd build
        echo "Running ${{ matrix.build_type }} unit tests with ${{ matrix.mpi_ranks }} ranks"
        mpiexec -n ${{ matrix.mpi_ranks }} ./tests/unit_tests